# Keep GitHub Actions up to date with GitHub's Dependabot...
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file#package-ecosystem
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - '*' # Group all Actions updates into a single larger pull request
    schedule:
      interval: weekly
    # Let every upstream release age before we adopt it. A compromised release
    # is usually caught and yanked within days; waiting two weeks means we never
    # pin a SHA during that window. github-actions supports default-days only
    # (the semver-*-days variants are unsupported for this ecosystem).
    cooldown:
      default-days: 14
